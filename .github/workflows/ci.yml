name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Placeholders: the build only needs these to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  database:
    name: pgTAP security suite (staging)
    runs-on: ubuntu-latest
    # Runs on main only: the suite executes against the shared staging
    # project, and pull requests from forks must never receive its URL.
    if: github.event_name == 'push'
    env:
      SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pgTAP suite
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "STAGING_SUPABASE_DB_URL secret not set; skipping."
            exit 0
          fi
          npm run test:db
